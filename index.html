const $=id=>document.getElementById(id);

const q=c=>d.querySelector(c);q('summary').textContent=k.name+'  ⭐'+k.stars;q('.ren').value=k.name;[0,1,2,3].forEach(i=>{const c=q('.f'+i);c.checked=k.fry[i];c.onchange=e=>{k.fry[i]=e.target.checked;saveDB()}});q('.cp').checked=k.pic;q('.cw').value=k.custom.join(' ');q('.sp').value=k.speed;q('.st').textContent=k.stars;q('.mc').textContent=m.length;
Object.keys(k.prog).sort().forEach(w=>{const s=document.createElement('span');s.textContent=w+(k.prog[w]>=2?' ✓':' ·'+k.prog[w]);if(k.prog[w]<2)s.className='w';q('.chips').appendChild(s)});
q('.ren').onchange=e=>{const n=clean(e.target.value);if(n){k.name=n;saveDB();renderTeacher()}else e.target.value=k.name};
q('.cp').onchange=e=>{k.pic=e.target.checked;saveDB()};

function hp(p){let h=2166136261;for(const c of 'lt-salt:'+p){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}
let pinMode,pinBuf='',pinFirst='';const PT={enter:'Enter Teacher PIN',set1:'Create a 4-digit Teacher PIN',set2:'Enter the same PIN again'};

function drawPin(err){$('ptitle').textContent=err||PT[pinMode];$('pdots').textContent='●'.repeat(pinBuf.length)+'○'.repeat(4-pinBuf.length);$('pforgot').style.display=pinMode=='enter'?'inline-block':'none'}

['1','2','3','4','5','6','7','8','9','<','0'].forEach((k,i)=>{const b=document.createElement('button');b.textContent=k=='<'?'⌫':k;b.style.background=CC[[0,4,3,2,5][i%5]];b.onclick=()=>pinKey(k);$('pad').appendChild(b)});
function openTeacher(){renderTeacher();show('teacher')}
$('tbtn').onclick=()=>openPin(DB.pin?'enter':'set1');$('pcancel').onclick=goHome;$('chpin').onclick=()=>openPin('set1');
$('pforgot').onclick=()=>{const a=6+Math.floor(Math.random()*7),b=6+Math.floor(Math.random()*7),r=prompt('Grown-up check: what is '+a+' × '+b+'?');if(r===null)return;if(+r==a*b)openPin('set1');else alert('Not quite — try again.')};$('tback').onclick=goHome;
const addKid=()=>{const n=clean($('newk').value);if(!n)return;DB.kids.push(newKid(n));saveDB();$('newk').value='';renderTeacher()};$('addk').onclick=addKid;$('newk').onkeydown=e=>{if(e.key=='Enter')addKid()};

$('imp').onclick=()=>$('impf').click();$('impf').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.kids))throw 0;
d.kids=d.kids.filter(k=>k&&clean(k.name)).map(k=>Object.assign(newKid(k.name),k,{name:clean(k.name)}));if(confirm('Replace this class with '+d.kids.length+' kids from the file?')){DB=d;saveDB();renderTeacher()}}catch(er){alert('That file is not a Letter Traffic class backup.')}});e.target.value=''};
$('gear').onclick=e=>{e.stopPropagation();goHome()};
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('inst').style.display='block'});$('inst').onclick=()=>{if(dp){dp.prompt();dp=null;$('inst').style.display='none'}};
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone)$('ioshint').style.display='block';
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
function lanes(){const top=H*.5,bot=H*.95,h=(bot-top)/4;return[0,1,2,3].map(i=>top+h*(i+.75))}
function spawn(){const L=lanes(),li=Math.floor(Math.random()*4);const d=li%2?1:-1,sx=d<0?W+70*S:-70*S;if(cars.some(k=>k.l==li&&Math.abs(k.x-sx)<170*S))return;
const need=word[idx];let ch;if(sinceNeed>=1||Math.random()<.5){ch=need;sinceNeed=0}else{ch=String.fromCharCode(65+Math.floor(Math.random()*26));if(ch==need)sinceNeed=0;else sinceNeed++}

let hit=null,bd=1e9;for(const k of cars){const d=Math.hypot(k.x-px,k.y-40*S-py);if(d<95*S&&d<bd){bd=d;hit=k}}if(!hit)return;
say(hit.ch,1);if(hit.ch==word[idx]){ding();const sl=slotPos(idx);fly.push({ch:hit.ch,x:hit.x,y:hit.y-60*S,tx:sl.x,ty:sl.y,p:0,col:hit.col,i:idx});cars=cars.filter(k=>k!=hit);idx++;

x.fillStyle='#7b2ff7';rr(W*.43,sy+sh*.45,W*.14,sh*.55,12*S);x.fill();
